<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Personal Expense Calculator</h1>

        <p class="description">
            Track your daily expenses and calculate your total spending.
        </p>

        <div class="expense-card">

            <label for="food">Food</label>
            <input type="number" id="food" placeholder="Enter food expense">

            <label for="travel">Travel</label>
            <input type="number" id="travel" placeholder="Enter travel expense">

            <label for="shopping">Shopping</label>
            <input type="number" id="shopping" placeholder="Enter shopping expense">

            <label for="other">Other</label>
            <input type="number" id="other" placeholder="Enter other expense">

            <button id="calculateBtn">Calculate Total</button>

            <div class="result">
                <h2>Total Expenses</h2>
                <p id="total">₹0</p>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
